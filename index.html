更有价值」的信念。大二进入朱军老师实验室，与强化学习结缘。",tag:"opensource"},{year:"大三",age:"~20",title:"Bengio 组暑研",desc:"跟图灵奖得主 Yoshua Bengio 做 NLP 暑期研究，但并未获得理想成果。这段经历让他反思 NLP 与 RL 的路径差异。",tag:"research"},{year:"大四",age:"~21",title:"天授 Tianshou 诞生",desc:"两周写出第一版强化学习框架「天授」，1500行代码实现主流框架数千行的功能，训练效率提升40%。GitHub 9.2k stars。",tag:"build"},{year:"申请季",age:"~22",title:"PhD 受挫 → 觉醒",desc:"申请 PhD 只拿到 Master offer。苏航老师的一句话让他觉醒：摆脱固有评价体系，定义属于自己的成功标准。",tag:"turning"},{year:"CMU",age:"22-23",title:"硕士 + tuixue",desc:"疫情期间远程读 CMU 硕士。开发「推学在线」签证查询系统，日访问量突破百万，帮助数百万留学生抢到预约。",tag:"build"},{year:"2022",age:"~23",title:"加入 OpenAI",desc:"拒绝幻方(DeepSeek)、NVIDIA、TikTok，在 ChatGPT 爆发前选择 OpenAI。与 John Schulman 面试时一拍即合。",tag:"turning"},{year:"2022-now",age:"23-27",title:"GPT 系列核心贡献者",desc:"搭建 OpenAI 后训练 RL 基础设施，名字出现在 GPT-3.5、GPT-4、GPT-4o、GPT-5 的技术致谢名单中。",tag:"impact"}],Fd=[{icon:"🎮",title:"人生是一场游戏",subtitle:"游戏的结算分数",content:"如果人生是一场游戏，那么游戏的结算分数是你去世后认识你的人的数量。不是名留青史，而是你对现实世界、对真实的人有没有帮助。",reflection:"当我们把人生看作一个有明确「得分函数」的游戏，很多纠结就变得清晰了——你在优化什么？"},{icon:"⚡",title:"定义你自己的评价体系",subtitle:"摆脱他人的标尺",content:"大众觉得 GPA 高就是牛，paper 多就是牛。但那是别人设计的评价体系。他选择用 GitHub stars、用真实的 impact 来衡量自己。",reflection:"你现在追求的「分数」，是你自己定义的，还是别人的体系里的？"},{icon:"⛏️",title:"做卖铲子的人",subtitle:"最大化影响力的杠杆",content:"不去淘金，而是做铲子。搭建所有人都要用的 Infra，名字就会出现在每一个重大 release 上。这是最高杠杆的选择。",reflection:"在你的领域里，什么是「铲子」？什么是别人都需要但没人愿意做的基础设施？"},{icon:"🔓",title:"开源是一种慈善",subtitle:"代码即公共物品",content:"开源不是履历装饰，而是一种对世界的投入方式。把知识与资料公开、打破信息差——信息平权比捐楼更有社会价值。",reflection:"你有什么知识或工具，可以通过公开分享来帮助到更多人？"},{icon:"🔧",title:"工程 > 研究",subtitle:"在这个时代",content:"教一个 Researcher 如何做好 Engineering，要远比教一个 Engineer 如何做好 Research 难。学术界在 toy benchmark 上过拟合，工业界需要解决真实问题。",reflection:"你是在解决真实的问题，还是在某个 benchmark 上过拟合？"},{icon:"🧠",title:"Context 决定一切",subtitle:"不是智商，是信息",content:"他的工作并不需要极高的智商。如果换一个人，有他所有的 context，也能做到。人和人之间的差距，本质是 context 的差距。",reflection:"你缺的也许不是能力，而是 context。如何获取更多、更好的 context？"}],Gl=[{label:"Infra 决定上限",content:"模型公司本质上拼的是 Infra 的修 Bug 速度。Idea 是廉价的，真正拉开差距的是单位时间内能验证多少次想法。每家的 Infra 都有不同程度的 bug，谁修的 bug 越多，谁的模型训得就越好。",keyword:"iteration speed"},{label:"DeepSeek 的真正威胁",content:"外界看 DeepSeek 看的是榜单分数，OpenAI 内部看的是迭代速度。DeepSeek 是唯一一次让 OpenAI 内部真正警觉的对手——不是因为分数，而是因为他们迭代极快。",keyword:"real threat"},{label:"Post-Training 的本质",content:"只要存在反馈机制，你能把问题建模成一个环境，并从环境中获得反馈，这个「行动—反馈—更新」的闭环，本质上就是强化学习。Agent 和 LLM 的 post-training 没有本质区别，只是环境不同。",keyword:"RL everywhere"},{label:"Researcher 最先被替代",content:"纯 Researcher 可能是第一波被 AI 取代的职业，因为他们的工作流更容易被自动化。然后是工程师。最难被替代的是 Sales——说服一个人买单，AI 可能没那么容易。",keyword:"who's next"},{label:"AI CEO 的构想",content:"人类组织的千古难题是无法保持 context sharing 的一致性。如果模型有无限的 context，最大的应用场景就是做 CEO——解决组织的信息同步问题。",keyword:"infinite context"},{label:"AGI 的定义",content:"OpenAI 内部抓15个人可能有20种 AGI 定义。他自己的定义：如果 AI 能完成80%-90%我认为有意义的任务，那它可能就是 AGI 了。",keyword:"80% threshold"}];function Md({text:e,speed:t=30,onDone:n,className:r=""}){const[l,o]=Ee.useState(""),[i,u]=Ee.useState(!1);return Ee.useEffect(()=>{o(""),u(!1);let s=0;const c=setInterval(()=>{s++,o(e.slice(0,s)),s>=e.length&&(clearInterval(c),u(!0),n==null||n())},t);return()=>clearInterval(c)},[e]),v.jsxs("span",{className:r,children:[l,!i&&v.jsx("span",{style:{animation:"blink 1s step-end infinite"},children:"▊"})]})}function Dd({active:e,onNav:t}){return v.jsxs("nav",{style:{position:"fixed",top:0,left:0,right:0,zIndex:100,background:"rgba(10,10,14,0.85)",backdropFilter:"blur(12px)",borderBottom:"1px solid rgba(0,255,136,0.1)",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 24px",height:52,fontFamily:"'JetBrains Mono', 'Fira Code', monospace"},children:[v.jsxs("div",{style:{display:"flex",gap:6,alignItems:"center"},children:[v.jsx("span",{style:{color:"#00ff88",fontSize:13,fontWeight:700},children:"jiayi@openai"}),v.jsx("span",{style:{color:"#555",fontSize:13},children:":"}),v.jsx("span",{style:{color:"#6ac4ff",fontSize:13},children:"~"}),v.jsx("span",{style:{color:"#555",fontSize:13},children:"$"})]}),v.jsx("div",{style:{display:"flex",gap:2},children:rc.map(n=>v.jsx("button",{onClick:()=>t(n.id
